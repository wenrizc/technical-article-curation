services:
  tac:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm
    working_dir: /app
    command: uv run uvicorn tac.main:app --host 0.0.0.0 --port ${TAC_PORT:-1104} --reload
    ports:
      - "${TAC_PORT:-1104}:${TAC_PORT:-1104}"
    environment:
      TAC_RSSHUB_ENABLED: "true"
      TAC_RSSHUB_INSTANCE: "http://rsshub:1200"
      TAC_RSSHUB_STARTUP_CHECK: "true"
    volumes:
      - .:/app
    depends_on:
      - rsshub

  rsshub:
    build:
      context: ./rsshub-custom
    image: tac-rsshub:custom
    ports:
      - "1200:1200"
    env_file:
      - path: rsshub.env
        required: false

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450
